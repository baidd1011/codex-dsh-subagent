# Codex remains the parent process. This tree owns the ordinary DSH session
# runtime exposed through the stdio MCP server.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: deepseek-v4-pro

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: read-only
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-sandbox'
  config:
    timeoutMs: 60000

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask

- id: permission-presets
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    defaultPreset: read-only
    presets:
      read-only:
        sandbox: read-only
        approval: ask
        name: Read Only
      workspace-write:
        sandbox: workspace-write
        approval: ask
        name: Workspace Write
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: Danger Full Access

- id: filesystem
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents: []
    workspaceContext: false
    toolJobs: false

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: ./.sessions
    compression: none

- id: checkpoint
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'

- id: commands
  name: '@deepseek-ai/dsh-commands'

- id: goal
  name: '@deepseek-ai/dsh-goal'

- id: goal-round-driver
  name: '@deepseek-ai/dsh-goal-round-driver'

- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: deepseek-official

- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY

- id: compaction
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.08
    maxTokens: 8192
    compactionRetries: 1

- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: standard
    roots:
      # Use the CLI-shipped system preset so stdio and Web adapters compose the
      # same built-in standard persona and tool set.
      - path: ./apps/cli/config/agent-presets
        trust: system
    includeUserRoot: false

# The service and provider are on the DSH host plane. The selected native preset
# mounts its model-facing consumers into each ordinary DSH session scope.
- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'

- id: tool-subagent-list
  name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

- id: mcp-agent-server
  name: '@deepseek-ai/dsh-mcp-agent-server'
  config:
    allowedRoots:
      - !!js process.cwd()
    allowedPermissionPresets:
      - read-only
      - workspace-write
      - danger-full-access
    defaultPermissionPreset: read-only
    maxWaitMs: 30000
    maxResultBytes: 65536
